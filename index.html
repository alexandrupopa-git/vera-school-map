<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vera's School Map</title>
<meta name="description" content="Where to rent in the UK from autumn 2028 so that one home works for state Reception 2029 and secondary 2036 — schools, chance of a place, rent, commute.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="theme-color" content="#0f6f8c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="School Map">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="vendor/leaflet.css?v=202611020857">
<link rel="stylesheet" href="app.css?v=202611020857">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand"><span class="brand-mark"></span><span class="brand-name">Vera's School Map</span><span class="brand-sub">Reception 2029 · Year 7 2036 · one home</span></div>
    <form id="searchForm" class="search" autocomplete="off">
      <input id="searchBox" type="search" placeholder="Street, postcode, place or 'lat, lon' — e.g. Canbury Park Road, Kingston" aria-label="Search a postcode or coordinates">
      <button type="submit" class="btn btn-primary">Check this spot</button>
    </form>
    <div class="topbar-actions">
      <button id="btnLocate" class="btn btn-ghost" title="Use my location">⌖ Me</button>
      <button id="btnShare" class="btn btn-ghost" title="Copy a link to this view">Share view</button>
      <button id="btnPanel" class="btn btn-ghost only-mobile" aria-expanded="true">Panel</button>
    </div>
  </header>

  <main id="main">
    <aside id="panel" class="open">
      <nav class="tabs" role="tablist">
        <button class="tab active" data-tab="explore" role="tab">Map</button>
        <button class="tab" data-tab="pin" role="tab">Pin <span id="pinBadge" class="badge" hidden></span></button>
        <button class="tab" data-tab="compare" role="tab">Compare <span id="compareBadge" class="badge" hidden></span></button>
        <button class="tab" data-tab="saved" role="tab">Saved <span id="savedBadge" class="badge" hidden></span></button>
        <button class="tab" data-tab="help" role="tab">Help</button>
      </nav>
      <div class="panel-body">
        <section id="tab-explore" class="tabpane active"></section>
        <section id="tab-pin" class="tabpane"></section>
        <section id="tab-compare" class="tabpane"></section>
        <section id="tab-saved" class="tabpane"></section>
        <section id="tab-help" class="tabpane"></section>
      </div>
    </aside>
    <div id="mapwrap">
      <div id="map" role="application" aria-label="Map"></div>
      <div id="legend" class="legend"></div>
      <div id="hint" class="hint">Tap anywhere on the map to check that spot. Click a school for its rings.</div>
      <div id="toast" class="toast" hidden></div>
    </div>
  </main>
</div>

<script src="vendor/leaflet.js?v=202611020857"></script>
<!-- data: one global each, editable without rebuilding the app -->
<script src="data/config.js?v=202611020857"></script>

<script src="data/stations.js?v=202611020857"></script>
<script src="data/parks.js?v=202611020857"></script>
<script src="data/extras.js?v=202611020857"></script>
<script src="data/nature.js?v=202611020857"></script>
<script src="engine.js?v=202611020857"></script>
<script src="app.js?v=202611020857"></script>
<script src="panel.js?v=202611020857"></script>
<script src="chat.js?v=202611020857"></script>
<script src="enrich.js?v=202611020857"></script>
</body>
</html>
